name: devops-practice
services:
  lab1:
    build:
      context: .
      args:
        SCENARIO: "1"
    hostname: incident-1
    ports:
      - "127.0.0.1:2221:22"
    volumes:
      - ./.lab/id_ed25519.pub:/etc/lab/authorized_key.pub:ro,z
    extra_hosts:
      - "inventory.internal:127.0.0.1"
    cgroup: private
    cap_add:
      - SYS_ADMIN
    tmpfs:
      - /run
    restart: unless-stopped
    stop_signal: SIGRTMIN+3
    stop_grace_period: 20s
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 256
    networks:
      - incident1
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 5s
      timeout: 2s
      retries: 12
